name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # The brain runs on macOS, Linux and Windows, and what breaks on one
    # (encodings, the command line, process groups, paths) passes on the others.
    # fail-fast off: a red Windows leg must not hide what the other two say.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # bash everywhere (Git Bash on Windows), so every step reads the same on
    # all three; `python` is what setup-python puts on PATH on each.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 gives us full history + the base ref, needed by the
          # "docs ship with behavior" step to diff against the PR's merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node builds and tests the frontend, and test_contracts.py parses the
      # bundle that build produced with `node --check` -- a guard that SKIPS
      # ITSELF when node (or the bundle) is absent. ubuntu-latest happens to
      # ship node, so that guard would run today by accident and start passing
      # vacuously the day a runner image drops it, which is exactly the silent
      # failure it exists to catch.
      # Installing it makes that non-incidental.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Byte-compile scripts and hooks
        run: python -m compileall -q scripts hooks services

      # The frontend is the only part of the repo with a toolchain. Its suites
      # are unit (components, hooks, pure logic) and integration (a whole section
      # driven against a mock server), and both run here.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build the frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # The build output is NOT committed -- `scripts/serve.py` produces it on
      # first start. Nothing to compare here; the build step above is the check,
      # and it fails on a type error or a broken import like any other.
      - name: The build output stays out of git
        run: |
          if [ -n "$(git ls-files frontend/dist)" ]; then
            echo "frontend/dist is tracked — it is a build artifact and must not be:"
            echo "    git rm -r --cached frontend/dist"
            git ls-files frontend/dist
            exit 1
          fi
          echo "frontend/dist is untracked, as it should be"

      # serve.py builds the API server's venv under ~/.cache/memory-ledger on
      # first start, named by a hash of the requirements and the Python version.
      # Keyed the same way here, so a pin change is a fresh venv in CI too.
      - name: Cache the server venv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cache/memory-ledger
          key: server-venv-${{ runner.os }}-py3.12-${{ hashFiles('scripts/requirements-server.txt', 'services/b2b/requirements.txt') }}

      # The suites are pytest suites (tests/conftest.py holds the shared
      # fixtures); pytest is the only thing they install. They are otherwise
      # self-contained: the servers they start bring their own venv (serve.py
      # builds it from scripts/requirements-server.txt), and the cache step
      # above keeps that to one pip install per pin change.
      - name: Install pytest
        run: python -m pip install pytest pytest-timeout

      # Why the server does (not) come up, in the open: the real command the
      # fixtures run, with its whole output, capped at 60 s. Never fails the job.
      - name: Diagnose the API server start
        continue-on-error: true
        env:
          SECOND_BRAIN_HOME: ${{ runner.temp }}/brain-diag
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p "$SECOND_BRAIN_HOME"
          start=$(date +%s)
          timeout 60 python scripts/serve.py --port 8765 --no-open --no-reload --no-build || echo "exit $? after $(( $(date +%s) - start ))s"

      # SECOND_BRAIN_HOME points at a temp dir so a run can never touch a real
      # brain (conftest.py also scrubs the Neo4j and integration variables and
      # gives every test a throwaway home of its own) -- test_contracts builds
      # its own graph, and test_traceability starts servers and asserts the
      # hooks do not block on a slow master.
      # (every tests/test_*.py, so test_usage_report.py and test_usage_ingest.py
      # run here too -- the ingest suite writes its own synthetic session logs.)
      - name: Run the test suites
        # XDG_CACHE_HOME is the cached directory above, on every OS (on
        # Windows it would otherwise be %LOCALAPPDATA%). PYTHONIOENCODING is
        # for pytest's own progress output only, which names things in
        # Portuguese: the code under test gets no help, so a missing
        # encoding= still fails on Windows (tests/test_encoding.py).
        env:
          SECOND_BRAIN_HOME: ${{ runner.temp }}/brain
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests --timeout=300 --durations=25

      # Manifest validation exists because .claude-plugin/plugin.json and
      # marketplace.json are hand-edited and never executed — a typo or a
      # name mismatch between them silently breaks `/plugin install
      # memory-ledger@memory-ledger` for every user, with no error until
      # someone tries to install.
      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          import re
          import sys

          def load(path):
              with open(path) as f:
                  return json.load(f)

          try:
              plugin = load(".claude-plugin/plugin.json")
          except Exception as e:
              sys.exit(f"plugin.json is not valid JSON: {e}")

          try:
              marketplace = load(".claude-plugin/marketplace.json")
          except Exception as e:
              sys.exit(f"marketplace.json is not valid JSON: {e}")

          for field in ("name", "description", "version"):
              value = plugin.get(field)
              if not isinstance(value, str) or not value.strip():
                  sys.exit(f"plugin.json: '{field}' must be a non-empty string")

          version = plugin["version"]
          if not re.match(r"^\d+\.\d+\.\d+$", version):
              sys.exit(f"plugin.json: version '{version}' does not match ^\\d+\\.\\d+\\.\\d+$")

          mp_name = marketplace.get("name")
          if not isinstance(mp_name, str) or not mp_name.strip():
              sys.exit("marketplace.json: 'name' must be a non-empty string")

          plugins = marketplace.get("plugins")
          if not isinstance(plugins, list) or not plugins:
              sys.exit("marketplace.json: 'plugins' must be a non-empty array")

          for i, entry in enumerate(plugins):
              for field in ("name", "source", "description"):
                  value = entry.get(field) if isinstance(entry, dict) else None
                  if not isinstance(value, str) or not value.strip():
                      sys.exit(f"marketplace.json: plugins[{i}].'{field}' must be a non-empty string")

          self_entries = [e for e in plugins if e.get("source") == "./"]
          if not self_entries:
              sys.exit("marketplace.json: no entry with source == \"./\" found")

          mp_plugin_name = self_entries[0]["name"]
          plugin_name = plugin["name"]
          if mp_plugin_name != plugin_name:
              sys.exit(
                  "plugin name mismatch: plugin.json name="
                  f"'{plugin_name}' but marketplace.json entry (source=\"./\") name="
                  f"'{mp_plugin_name}' — this breaks `/plugin install <plugin>@<marketplace>`"
              )

          print("manifests OK")
          PY

      # Hook manifest validation exists because hooks/hooks.json is also
      # hand-edited and never executed at commit time — a hook registered
      # against a renamed/deleted file is a silent no-op in production: the
      # event fires, the command fails to launch, and nothing surfaces that
      # to a user.
      - name: Validate hook manifest paths
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          repo_root = Path(".").resolve()

          with open("hooks/hooks.json") as f:
              manifest = json.load(f)

          missing = []
          checked = 0

          def walk(node):
              if isinstance(node, dict):
                  if "command" in node and isinstance(node["command"], str):
                      yield node["command"]
                  for v in node.values():
                      yield from walk(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from walk(v)

          for command in walk(manifest):
              # commands look like: python3 "${CLAUDE_PLUGIN_ROOT}/hooks/foo.py"
              for match in re.finditer(r'"\$\{CLAUDE_PLUGIN_ROOT\}([^"]+)"', command):
                  checked += 1
                  rel_path = match.group(1).lstrip("/")
                  full_path = repo_root / rel_path
                  if not full_path.is_file():
                      missing.append(str(full_path))

          if checked == 0:
              sys.exit("no ${CLAUDE_PLUGIN_ROOT}-relative commands found in hooks/hooks.json — check the parser")

          if missing:
              sys.exit("hooks.json references missing files:\n" + "\n".join(f"  - {p}" for p in missing))

          print(f"hook manifest OK ({checked} command paths verified)")
          PY

      # CONVENTIONS §5/§5a, run on EVERY event. It used to reach CI only inside
      # the pre-commit invocation below, which is gated to pull_request -- so a
      # commit pushed straight to main never had its contracts checked by
      # anything but the author's own local hook, and a push from a clone that
      # never ran `git config core.hooksPath .githooks` had them checked by
      # nothing at all. Unlike the §4 check under it, this one needs no base ref:
      # it reads the working tree, so it works the same on a push and a PR.
      - name: Skill contracts and the dependency tree (CONVENTIONS §5, §5a)
        run: bash scripts/check-contracts.sh

      # Docs-ship-with-behavior is CONVENTIONS.md §4, enforced locally by the
      # .githooks/pre-commit hook. That hook reads `git diff --cached`, i.e.
      # index-vs-HEAD, which in a CI checkout is empty — the PR's changes are
      # already IN HEAD. `git reset --soft` moves HEAD back to the merge base
      # while leaving the index and worktree alone, so index-vs-HEAD becomes
      # exactly base-vs-PR and the existing hook runs unmodified. (Staging the
      # files instead does nothing: `git add` on content already identical to
      # HEAD is a no-op, and the check would silently pass on every PR.)
      #
      # This one stays PR-only, deliberately. §4 has a documented escape hatch
      # (`git commit --no-verify`) for a genuinely doc-neutral change -- a
      # release commit that only bumps plugin.json is the standing example --
      # and a push-triggered check has no way to honor a bypass the author
      # already took at commit time. Enforcing it on push would turn every such
      # release into a red build.
      - name: Docs ship with behavior (CONVENTIONS §4)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git reset --soft "$BASE_REF"
          python .githooks/pre-commit
